<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LOS SICARIOS</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=6"></script>

<style>
:root{
  --white:#ffffff;
  --black:#000000;
  --gray:#9b9b9b;
  --glass:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.14);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--white);
  background:#000;
  overflow-x:hidden;
}

/* ===== LOADER ===== */
#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.9)),
    url("https://tgwos.github.io/LOS-SICARIOS/logosfondo.jpg")
    center/cover no-repeat;
}

#loader::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle,rgba(255,255,255,.08),rgba(0,0,0,.9));
}

#loader-content{
  position:relative;
  z-index:2;
  text-align:center;
  animation:fadeZoom 1.4s ease forwards;
}

#loader-content img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 0 35px rgba(255,255,255,.18);
}

#loader-text{
  margin-top:22px;
  font-size:24px;
  font-weight:900;
  letter-spacing:8px;
  color:#fff;
  text-shadow:0 0 18px rgba(255,255,255,.45);
}

@keyframes fadeZoom{
  from{opacity:0;transform:scale(.88)}
  to{opacity:1;transform:scale(1)}
}

/* ===== BACKGROUND ===== */
.app-bg{
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.96)),
    url("https://tgwos.github.io/LOS-SICARIOS/logosfondo.jpg")
    center/cover no-repeat;
}

.app-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top,rgba(255,255,255,.08),transparent 35%),
    linear-gradient(to bottom,transparent,rgba(0,0,0,.85));
}

/* ===== LAYOUT ===== */
.container{
  padding:30px 16px 125px;
  display:flex;
  flex-direction:column;
  gap:26px;
  align-items:center;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  text-align:center;
}

.logo-main{
  width:145px;
  height:145px;
  object-fit:cover;
  border-radius:26px;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:
    0 0 25px rgba(255,255,255,.16),
    inset 0 0 20px rgba(255,255,255,.06);
}

.header span{
  font-size:17px;
  font-weight:900;
  letter-spacing:5px;
  text-shadow:0 0 12px rgba(255,255,255,.35);
}

.subtitle{
  font-size:11px;
  letter-spacing:3px;
  color:var(--gray);
  font-weight:700;
}

/* ===== PANEL ===== */
.panel{
  width:100%;
  max-width:430px;
  background:rgba(5,5,5,.82);
  border-radius:30px;
  padding:24px;
  border:1px solid var(--border);
  backdrop-filter:blur(14px);
  box-shadow:
    0 20px 60px rgba(0,0,0,.65),
    inset 0 0 25px rgba(255,255,255,.03);
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

/* ===== CATALOGO ===== */
.card-catalog{
  grid-column:1/-1;
  height:185px;
  border-radius:26px;
  cursor:pointer;
  background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.82)),
    url("https://tgwos.github.io/LOS-SICARIOS/logosfondo.jpg")
    center/cover no-repeat;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 0 30px rgba(255,255,255,.08),
    inset 0 0 40px rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.25s ease;
}

.card-catalog:active,
.small-wrapper:active{
  transform:scale(.97);
}

.card-catalog span{
  font-size:27px;
  font-weight:900;
  letter-spacing:8px;
  color:#fff;
  text-shadow:0 0 18px rgba(255,255,255,.45);
}

/* ===== BOTTONI PICCOLI ===== */
.small-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:.25s ease;
}

.card-small{
  width:100%;
  height:122px;
  border-radius:24px;
  background:var(--glass);
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 18px rgba(255,255,255,.04),
    0 12px 24px rgba(0,0,0,.45);
  overflow:hidden;
}

.card-small img{
  width:88%;
  height:88%;
  object-fit:cover;
  border-radius:18px;
  filter:grayscale(1) contrast(1.15);
}

.small-label{
  padding:7px 14px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  background:#fff;
  color:#000;
  box-shadow:0 0 16px rgba(255,255,255,.16);
}

/* ===== POPUP ===== */
.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  backdrop-filter:blur(8px);
  z-index:999;
}

.popup-overlay.show{
  opacity:1;
  pointer-events:auto;
}

.popup-box{
  min-width:260px;
  max-width:330px;
  padding:24px;
  border-radius:24px;
  background:rgba(8,8,8,.96);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 0 40px rgba(255,255,255,.12);
  text-align:center;
}

.popup-title{
  font-size:15px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:16px;
}

.popup-link{
  display:block;
  padding:13px 10px;
  margin-top:10px;
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
  color:#fff;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  text-decoration:none;
}

/* ===== BOTTOM BAR ===== */
.bottom-bar{
  position:fixed;
  bottom:14px;
  left:14px;
  right:14px;
  height:68px;
  background:rgba(5,5,5,.9);
  border-radius:26px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(14px);
  box-shadow:0 0 35px rgba(0,0,0,.8);
  z-index:20;
}

.bottom-bar a{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:rgba(255,255,255,.05);
}

.bottom-bar svg{
  width:23px;
  height:23px;
  fill:#fff;
  stroke:#fff;
}

/* ===== MOBILE ===== */
@media(max-width:360px){
  .card-catalog span{
    font-size:23px;
    letter-spacing:6px;
  }

  .panel{
    padding:20px;
  }
}
</style>
</head>

<body>

<div id="loader">
  <div id="loader-content">
    <img src="https://tgwos.github.io/LOS-SICARIOS/logosfondo.jpg">
    <div id="loader-text">LOS SICARIOS</div>
  </div>
</div>

<div class="app-bg"></div>

<div class="container">

  <div class="header">
    <img class="logo-main" src="https://tgwos.github.io/LOS-SICARIOS/logopricipale.jpg">
    <span>LOS SICARIOS</span>
    <div class="subtitle">PRIVATE CATALOG</div>
  </div>

  <div class="panel">
    <div class="grid">

      <div class="card-catalog" onclick="location.href='catalog.html'">
        <span>CATALOGO</span>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CONTACT',
             '📨 Telegram',
             'https://t.me/Italianfarm11',
             '📞 Signal',
             'https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/LOS-SICARIOS/logopricipale.jpg">
        </div>
        <div class="small-label">CONTACTS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CHANNEL',
             '📢 Telegram Channel',
             'https://t.me/+TJZTE4SGZBRhNTE0',
             '📞 Signal Group',
             'https://signal.group/#CjQKIDNGRGl9UmFJzST3ADxn0PsPIc0zsRWW1foOy3Ity-KvEhBjRjUNbHUuV1qczApKp_ok'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/LOS-SICARIOS/logopricipale.jpg">
        </div>
        <div class="small-label">CHANNELS</div>
      </div>

      <div class="small-wrapper"
           onclick="openPopup(
             'CREATED BY',
             '👨‍💻 BOX CREATE',
             'https://t.me/boxcreate22'
           )">
        <div class="card-small">
          <img src="https://tgwos.github.io/LOS-SICARIOS/logopricipale.jpg">
        </div>
        <div class="small-label">CREATED BY</div>
      </div>

      <div class="small-wrapper" onclick="location.href='recensioni.html'">
        <div class="card-small">
          <img src="https://tgwos.github.io/LOS-SICARIOS/logopricipale.jpg">
        </div>
        <div class="small-label">RECENSIONI</div>
      </div>

    </div>
  </div>
</div>

<div id="popup" class="popup-overlay" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popup-title"></div>
    <a class="popup-link" id="popup-link-telegram" href="#"></a>
    <a class="popup-link" id="popup-link-signal" href="#" style="display:none;"></a>
  </div>
</div>

<div class="bottom-bar">
  <a onclick="openExternal('https://t.me/Italianfarm1')">
    <svg viewBox="0 0 24 24">
      <path d="M22.5 3.5L2.8 10.9c-.9.3-.9 1.6.1 1.9l4.9 1.6 1.9 5.9c.3.9 1.5 1 2 .2l2.8-4.1 5.6 4.1c.8.6 2 .1 2.2-.9l3.4-15.3c.2-.9-.7-1.6-1.7-1.4z"/>
    </svg>
  </a>

  <a onclick="openExternal('https://instagram.com/INSERT_LINK')">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke-width="2"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke-width="2"/>
      <circle cx="17.5" cy="6.5" r="1.2"/>
    </svg>
  </a>

  <a onclick="openExternal('https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5')">
    <svg viewBox="0 0 24 24">
      <path d="M12 2a10 10 0 1 0 0 20"/>
    </svg>
  </a>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

if(tg){
  tg.ready();
  tg.expand();
}

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.opacity = "0";
    setTimeout(()=>{
      document.getElementById("loader").style.display = "none";
    },400);
  },2500);
});

const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popup-title");
const popupTelegram = document.getElementById("popup-link-telegram");
const popupSignal = document.getElementById("popup-link-signal");

function openExternal(url){
  if(tg){
    tg.openLink(url);
  } else {
    window.open(url,"_blank");
  }
}

function openPopup(title, tgText, tgUrl, signalText, signalUrl){
  popupTitle.innerText = title;

  popupTelegram.innerText = tgText;
  popupTelegram.href = tgUrl;
  popupTelegram.onclick = function(e){
    e.preventDefault();
    openExternal(tgUrl);
  };
  popupTelegram.style.display = "block";

  if(signalText && signalUrl){
    popupSignal.innerText = signalText;
    popupSignal.href = signalUrl;
    popupSignal.onclick = function(e){
      e.preventDefault();
      openExternal(signalUrl);
    };
    popupSignal.style.display = "block";
  } else {
    popupSignal.style.display = "none";
  }

  popup.classList.add("show");
}

function closePopup(){
  popup.classList.remove("show");
}
</script>

</body>
</html>
