<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>LOS SICARIOS</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --white: #ffffff;
      --muted: rgba(255,255,255,.64);
      --line: rgba(255,255,255,.16);
      --glass: rgba(255,255,255,.08);
      --glass-strong: rgba(255,255,255,.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .app-bg {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: url("logosfondo.jpg") center / cover no-repeat;
      transform: scale(1.04);
    }

    .app-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.25), transparent 24%),
        radial-gradient(circle at 20% 34%, rgba(255,255,255,.12), transparent 22%),
        linear-gradient(to bottom, rgba(0,0,0,.42), rgba(0,0,0,.83) 46%, rgba(0,0,0,.98));
    }

    .app-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.032) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.85), transparent 70%);
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.95)),
        url("logosfondo.jpg") center / cover no-repeat;
      transition: opacity .45s ease, visibility .45s ease;
    }

    .loader-card {
      position: relative;
      text-align: center;
      animation: enter .9s ease both;
    }

    .loader-card::before {
      content: "";
      position: absolute;
      inset: -34px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 0 90px rgba(255,255,255,.16), inset 0 0 60px rgba(255,255,255,.08);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .logo {
      position: relative;
      width: 142px;
      height: 142px;
      object-fit: cover;
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.06);
      box-shadow:
        0 0 36px rgba(255,255,255,.18),
        0 24px 60px rgba(0,0,0,.85),
        inset 0 0 26px rgba(255,255,255,.08);
    }

    .loader-title {
      position: relative;
      margin-top: 22px;
      font-size: 22px;
      font-weight: 1000;
      letter-spacing: 8px;
      text-shadow: 0 0 26px rgba(255,255,255,.62);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(.94); opacity: .7; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(18px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 16px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .hero {
      text-align: center;
      padding-top: 10px;
    }

    .logo-ring {
      position: relative;
      width: fit-content;
      margin: 0 auto 20px;
    }

    .logo-ring::before,
    .logo-ring::after {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 45px;
      border: 1px solid rgba(255,255,255,.22);
      transform: rotate(8deg);
    }

    .logo-ring::after {
      inset: -24px;
      opacity: .35;
      transform: rotate(-8deg);
    }

    .hero .logo {
      width: 154px;
      height: 154px;
      border-radius: 38px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.42);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(16px);
      color: rgba(255,255,255,.76);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 16px rgba(255,255,255,.9);
    }

    h1 {
      margin: 15px 0 8px;
      font-size: clamp(36px, 12vw, 58px);
      line-height: .88;
      font-weight: 1000;
      letter-spacing: -2px;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(255,255,255,.34), 0 18px 35px rgba(0,0,0,.9);
    }

    .subtitle {
      max-width: 335px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .buttons-panel {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: 16px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.04)),
        rgba(0,0,0,.66);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow:
        0 28px 75px rgba(0,0,0,.86),
        inset 0 1px 0 rgba(255,255,255,.20);
      backdrop-filter: blur(18px);
    }

    .buttons-panel::before {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      background: linear-gradient(115deg, transparent, rgba(255,255,255,.22), transparent 43%);
      transform: translateX(-110%);
      animation: shine 4.8s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 30% { transform: translateX(-110%); }
      58%, 100% { transform: translateX(110%); }
    }

    .btn {
      position: relative;
      isolation: isolate;
      width: 100%;
      border: 0;
      color: #fff;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      overflow: hidden;
      transition: transform .16s ease, border-color .16s ease;
    }

    .btn:active {
      transform: scale(.974);
    }

    .btn-main {
      min-height: 168px;
      border-radius: 29px;
      padding: 20px;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.04), rgba(0,0,0,.72)),
        url("logosfondo.jpg") center / cover no-repeat;
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: inset 0 0 45px rgba(255,255,255,.06), 0 18px 42px rgba(0,0,0,.56);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .btn-main::after {
      content: "";
      position: absolute;
      right: -34px;
      top: -38px;
      width: 135px;
      height: 135px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: inset 0 0 30px rgba(255,255,255,.07);
      z-index: -1;
    }

    .btn-kicker {
      color: rgba(255,255,255,.65);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .btn-title {
      display: block;
      margin-top: 7px;
      font-size: 35px;
      line-height: .9;
      font-weight: 1000;
      letter-spacing: -1.2px;
      text-transform: uppercase;
    }

    .btn-arrow {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.18);
      font-size: 23px;
      font-weight: 1000;
    }

    .btn-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-card {
      min-height: 120px;
      border-radius: 25px;
      padding: 15px;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,.18), transparent 38%),
        linear-gradient(150deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 0 28px rgba(255,255,255,.035), 0 12px 28px rgba(0,0,0,.42);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .btn-card::before {
      content: "";
      position: absolute;
      width: 75px;
      height: 75px;
      right: -25px;
      bottom: -25px;
      border-radius: 26px;
      background: rgba(255,255,255,.08);
      transform: rotate(20deg);
      z-index: -1;
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: inset 0 0 18px rgba(255,255,255,.045);
      font-size: 22px;
    }

    .btn-card .btn-title {
      font-size: 15px;
      line-height: 1.05;
      letter-spacing: .3px;
    }

    .mini-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 12px;
    }

    .mini {
      min-height: 55px;
      border-radius: 19px;
      padding: 10px 6px;
      background: rgba(0,0,0,.34);
      border: 1px solid rgba(255,255,255,.10);
      text-align: center;
    }

    .mini b {
      display: block;
      font-size: 13px;
      letter-spacing: .8px;
    }

    .mini span {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.55);
      font-size: 8px;
      font-weight: 950;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(13px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }

    .popup-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-box {
      width: 100%;
      max-width: 480px;
      border-radius: 30px;
      padding: 20px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.04)),
        rgba(4,4,4,.94);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 24px 80px rgba(0,0,0,.88), inset 0 1px 0 rgba(255,255,255,.18);
      transform: translateY(22px) scale(.98);
      transition: transform .22s ease;
    }

    .popup-overlay.show .popup-box {
      transform: translateY(0) scale(1);
    }

    .popup-handle {
      width: 46px;
      height: 5px;
      border-radius: 999px;
      margin: 0 auto 18px;
      background: rgba(255,255,255,.25);
    }

    .popup-title {
      margin-bottom: 14px;
      font-size: 24px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -1px;
      text-transform: uppercase;
      text-align: center;
    }

    .popup-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 16px;
      margin-top: 10px;
      color: #fff;
      text-decoration: none;
      border-radius: 20px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.13);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .popup-link::after {
      content: "↗";
      opacity: .75;
      font-size: 18px;
    }

    @media (max-width: 370px) {
      .page { padding-left: 13px; padding-right: 13px; gap: 14px; }
      .hero .logo { width: 132px; height: 132px; }
      h1 { font-size: 36px; }
      .btn-main { min-height: 145px; }
      .btn-title { font-size: 30px; }
      .btn-card { min-height: 108px; padding: 13px; }
      .icon { width: 39px; height: 39px; border-radius: 15px; font-size: 20px; }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="loader-card">
      <img class="logo" src="logopricipale.jpg" alt="LOS SICARIOS" />
      <div class="loader-title">LOS SICARIOS</div>
    </div>
  </div>

  <div class="app-bg"></div>

  <main class="page">
    <section class="hero">
      <div class="logo-ring">
        <img class="logo" src="logopricipale.jpg" alt="LOS SICARIOS" />
      </div>

      <div class="badge"><span class="badge-dot"></span> Telegram Mobile Ready</div>
      <h1>LOS<br>SICARIOS</h1>
      <p class="subtitle">Index principale con accesso rapido a catalogo, contatti, canali e recensioni</p>
    </section>

    <section class="buttons-panel" aria-label="Menu principale">
      <button class="btn btn-main" type="button" data-page="catalog.html">
        <span class="btn-arrow">→</span>
        <span class="btn-kicker">Accesso principale</span>
        <strong class="btn-title">Catalogo</strong>
      </button>

      <div class="btn-grid">
        <button class="btn btn-card" type="button" data-popup="contacts">
          <span class="icon">✉️</span>
          <span>
            <span class="btn-kicker">Direct</span>
            <strong class="btn-title">Contacts</strong>
          </span>
        </button>

        <button class="btn btn-card" type="button" data-popup="channels">
          <span class="icon">📡</span>
          <span>
            <span class="btn-kicker">Official</span>
            <strong class="btn-title">Channels</strong>
          </span>
        </button>

        <button class="btn btn-card" type="button" data-page="recensioni.html">
          <span class="icon">★</span>
          <span>
            <span class="btn-kicker">Feedback</span>
            <strong class="btn-title">Recensioni</strong>
          </span>
        </button>

        <button class="btn btn-card" type="button" data-popup="created">
          <span class="icon">⚡</span>
          <span>
            <span class="btn-kicker">Design</span>
            <strong class="btn-title">Created By</strong>
          </span>
        </button>
      </div>

      <div class="mini-row" aria-hidden="true">
        <div class="mini"><b>24/7</b><span>Online</span></div>
        <div class="mini"><b>TG</b><span>Ready</span></div>
        <div class="mini"><b>VIP</b><span>Access</span></div>
      </div>
    </section>
  </main>

  <div id="popup" class="popup-overlay" aria-hidden="true">
    <div class="popup-box" role="dialog" aria-modal="true">
      <div class="popup-handle"></div>
      <div class="popup-title" id="popup-title"></div>
      <a class="popup-link" id="popup-link-1" href="#" target="_blank" rel="noopener"></a>
      <a class="popup-link" id="popup-link-2" href="#" target="_blank" rel="noopener" style="display:none;"></a>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#000000");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#000000");
    }

    const links = {
      contacts: {
        title: "Contact",
        firstText: "📨 Telegram",
        firstUrl: "https://t.me/Italianfarm11",
        secondText: "📞 Signal",
        secondUrl: "https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5"
      },
      channels: {
        title: "Channel",
        firstText: "📢 Telegram Channel",
        firstUrl: "https://t.me/+TJZTE4SGZBRhNTE0",
        secondText: "📞 Signal Group",
        secondUrl: "https://signal.group/#CjQKIDNGRGl9UmFJzST3ADxn0PsPIc0zsRWW1foOy3Ity-KvEhBjRjUNbHUuV1qczApKp_ok"
      },
      created: {
        title: "Created By",
        firstText: "👨‍💻 BOX CREATE",
        firstUrl: "https://t.me/boxcreate22"
      }
    };

    const popup = document.getElementById("popup");
    const popupTitle = document.getElementById("popup-title");
    const popupLink1 = document.getElementById("popup-link-1");
    const popupLink2 = document.getElementById("popup-link-2");

    function haptic(type) {
      if (!tg || !tg.HapticFeedback) return;
      if (type === "impact") tg.HapticFeedback.impactOccurred("medium");
      if (type === "success") tg.HapticFeedback.notificationOccurred("success");
    }

    function openExternal(url) {
      if (!url) return;
      haptic("impact");

      if (tg && typeof tg.openLink === "function") {
        tg.openLink(url);
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
      }
    }

    function openPopup(type) {
      const data = links[type];
      if (!data) return;

      haptic("success");
      popupTitle.textContent = data.title;

      popupLink1.textContent = data.firstText;
      popupLink1.href = data.firstUrl;
      popupLink1.onclick = function(event) {
        event.preventDefault();
        openExternal(data.firstUrl);
      };

      if (data.secondText && data.secondUrl) {
        popupLink2.textContent = data.secondText;
        popupLink2.href = data.secondUrl;
        popupLink2.style.display = "flex";
        popupLink2.onclick = function(event) {
          event.preventDefault();
          openExternal(data.secondUrl);
        };
      } else {
        popupLink2.style.display = "none";
        popupLink2.removeAttribute("href");
        popupLink2.onclick = null;
      }

      popup.classList.add("show");
      popup.setAttribute("aria-hidden", "false");
    }

    function closePopup() {
      popup.classList.remove("show");
      popup.setAttribute("aria-hidden", "true");
    }

    window.addEventListener("load", function() {
      setTimeout(function() {
        const loader = document.getElementById("loader");
        loader.style.opacity = "0";
        loader.style.visibility = "hidden";
      }, 900);
    });

    document.addEventListener("click", function(event) {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        haptic("impact");
        window.location.href = pageButton.dataset.page;
        return;
      }

      const popupButton = event.target.closest("[data-popup]");
      if (popupButton) {
        openPopup(popupButton.dataset.popup);
        return;
      }

      if (event.target === popup) {
        closePopup();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closePopup();
    });
  </script>
</body>
</html>
