<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOS SICARIOS</title>

  <!-- Telegram WebApp: non blocca il sito se non viene caricato -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --white: #ffffff;
      --black: #000000;
      --gray: #9b9b9b;
      --glass: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--white);
      background: #000;
      overflow-x: hidden;
    }

    body {
      padding-bottom: 110px;
    }

    .app-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,.96)),
        url("logosfondo.jpg") center / cover no-repeat;
    }

    .app-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 35%),
        linear-gradient(to bottom, transparent, rgba(0,0,0,.85));
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.9)),
        url("logosfondo.jpg") center / cover no-repeat;
      transition: opacity .4s ease;
    }

    #loader::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,.08), rgba(0,0,0,.9));
    }

    #loader-content {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: fadeZoom 1.2s ease forwards;
    }

    #loader-content img,
    .logo-main {
      width: 145px;
      height: 145px;
      object-fit: cover;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 0 35px rgba(255,255,255,.18);
      background: #111;
    }

    #loader-text {
      margin-top: 22px;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 7px;
      color: #fff;
      text-shadow: 0 0 18px rgba(255,255,255,.45);
    }

    @keyframes fadeZoom {
      from { opacity: 0; transform: scale(.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 30px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      align-items: center;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .header-title {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 12px rgba(255,255,255,.35);
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gray);
      font-weight: 700;
    }

    .panel {
      width: 100%;
      background: rgba(5,5,5,.82);
      border-radius: 30px;
      padding: 24px;
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        inset 0 0 25px rgba(255,255,255,.03);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card-catalog {
      grid-column: 1 / -1;
      height: 185px;
      border-radius: 26px;
      cursor: pointer;
      background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.82)),
        url("logosfondo.jpg") center / cover no-repeat;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow:
        0 0 30px rgba(255,255,255,.08),
        inset 0 0 40px rgba(0,0,0,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease;
    }

    .card-catalog:active,
    .small-wrapper:active,
    .bottom-bar a:active,
    .popup-link:active {
      transform: scale(.97);
    }

    .card-catalog span {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 8px;
      color: #fff;
      text-shadow: 0 0 18px rgba(255,255,255,.45);
    }

    .small-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .card-small {
      width: 100%;
      height: 122px;
      border-radius: 24px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 0 18px rgba(255,255,255,.04),
        0 12px 24px rgba(0,0,0,.45);
      overflow: hidden;
    }

    .card-small img {
      width: 88%;
      height: 88%;
      object-fit: cover;
      border-radius: 18px;
      filter: grayscale(1) contrast(1.15);
      background: #111;
    }

    .small-label {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      background: #fff;
      color: #000;
      box-shadow: 0 0 16px rgba(255,255,255,.16);
      text-align: center;
    }

    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      backdrop-filter: blur(8px);
      z-index: 999;
      padding: 20px;
    }

    .popup-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-box {
      width: 100%;
      max-width: 330px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(8,8,8,.96);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 0 40px rgba(255,255,255,.12);
      text-align: center;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 16px;
    }

    .popup-link {
      display: block;
      padding: 13px 10px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      text-decoration: none;
    }

    .bottom-bar {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      max-width: 452px;
      margin: 0 auto;
      height: 68px;
      background: rgba(5,5,5,.9);
      border-radius: 26px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      box-shadow: 0 0 35px rgba(0,0,0,.8);
      z-index: 20;
    }

    .bottom-bar a {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      cursor: pointer;
      transition: transform .2s ease;
    }

    .bottom-bar svg {
      width: 23px;
      height: 23px;
      fill: #fff;
      stroke: #fff;
    }

    @media (max-width: 360px) {
      .panel { padding: 20px; }
      .card-catalog span {
        font-size: 23px;
        letter-spacing: 6px;
      }
      .grid { gap: 14px; }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div id="loader-content">
      <img src="logopricipale.jpg" alt="Logo" onerror="this.src='logosfondo.jpg'" />
      <div id="loader-text">LOS SICARIOS</div>
    </div>
  </div>

  <div class="app-bg"></div>

  <main class="container">
    <header class="header">
      <img class="logo-main" src="logopricipale.jpg" alt="Logo principale" onerror="this.src='logosfondo.jpg'" />
      <div class="header-title">LOS SICARIOS</div>
      <div class="subtitle">PRIVATE CATALOG</div>
    </header>

    <section class="panel">
      <div class="grid">
        <div class="card-catalog" data-page="catalog.html">
          <span>CATALOGO</span>
        </div>

        <div class="small-wrapper" data-popup="contacts">
          <div class="card-small">
            <img src="logopricipale.jpg" alt="Contacts" onerror="this.src='logosfondo.jpg'" />
          </div>
          <div class="small-label">CONTACTS</div>
        </div>

        <div class="small-wrapper" data-popup="channels">
          <div class="card-small">
            <img src="logopricipale.jpg" alt="Channels" onerror="this.src='logosfondo.jpg'" />
          </div>
          <div class="small-label">CHANNELS</div>
        </div>

        <div class="small-wrapper" data-popup="created">
          <div class="card-small">
            <img src="logopricipale.jpg" alt="Created by" onerror="this.src='logosfondo.jpg'" />
          </div>
          <div class="small-label">CREATED BY</div>
        </div>

        <div class="small-wrapper" data-page="recensioni.html">
          <div class="card-small">
            <img src="logopricipale.jpg" alt="Recensioni" onerror="this.src='logosfondo.jpg'" />
          </div>
          <div class="small-label">RECENSIONI</div>
        </div>
      </div>
    </section>
  </main>

  <div id="popup" class="popup-overlay" aria-hidden="true">
    <div class="popup-box" role="dialog" aria-modal="true">
      <div class="popup-title" id="popup-title"></div>
      <a class="popup-link" id="popup-link-1" href="#" target="_blank" rel="noopener"></a>
      <a class="popup-link" id="popup-link-2" href="#" target="_blank" rel="noopener" style="display:none;"></a>
    </div>
  </div>

  <nav class="bottom-bar" aria-label="Social links">
    <a data-url="https://t.me/Italianfarm11" aria-label="Telegram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.5 3.5L2.8 10.9c-.9.3-.9 1.6.1 1.9l4.9 1.6 1.9 5.9c.3.9 1.5 1 2 .2l2.8-4.1 5.6 4.1c.8.6 2 .1 2.2-.9l3.4-15.3c.2-.9-.7-1.6-1.7-1.4z" />
      </svg>
    </a>

    <a data-url="https://instagram.com/" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke-width="2" />
        <circle cx="12" cy="12" r="4" fill="none" stroke-width="2" />
        <circle cx="17.5" cy="6.5" r="1.2" />
      </svg>
    </a>

    <a data-url="https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5" aria-label="Signal">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2a10 10 0 1 0 0 20" />
      </svg>
    </a>
  </nav>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const links = {
      contacts: {
        title: "CONTACT",
        firstText: "📨 Telegram",
        firstUrl: "https://t.me/Italianfarm11",
        secondText: "📞 Signal",
        secondUrl: "https://signal.me/#eu/kRf_X-QX9q6AnKI0IC9lsi2GjAiS7cLKf_MoHkGnHt1U3msPbTJOYJ7C2IOfVkU5"
      },
      channels: {
        title: "CHANNEL",
        firstText: "📢 Telegram Channel",
        firstUrl: "https://t.me/+TJZTE4SGZBRhNTE0",
        secondText: "📞 Signal Group",
        secondUrl: "https://signal.group/#CjQKIDNGRGl9UmFJzST3ADxn0PsPIc0zsRWW1foOy3Ity-KvEhBjRjUNbHUuV1qczApKp_ok"
      },
      created: {
        title: "CREATED BY",
        firstText: "👨‍💻 BOX CREATE",
        firstUrl: "https://t.me/boxcreate22"
      }
    };

    const popup = document.getElementById("popup");
    const popupTitle = document.getElementById("popup-title");
    const popupLink1 = document.getElementById("popup-link-1");
    const popupLink2 = document.getElementById("popup-link-2");

    function openExternal(url) {
      if (!url) return;

      if (tg && typeof tg.openLink === "function") {
        tg.openLink(url);
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
      }
    }

    function openPopup(type) {
      const data = links[type];
      if (!data) return;

      popupTitle.textContent = data.title;

      popupLink1.textContent = data.firstText;
      popupLink1.href = data.firstUrl;
      popupLink1.onclick = function(event) {
        event.preventDefault();
        openExternal(data.firstUrl);
      };

      if (data.secondText && data.secondUrl) {
        popupLink2.textContent = data.secondText;
        popupLink2.href = data.secondUrl;
        popupLink2.style.display = "block";
        popupLink2.onclick = function(event) {
          event.preventDefault();
          openExternal(data.secondUrl);
        };
      } else {
        popupLink2.style.display = "none";
        popupLink2.removeAttribute("href");
        popupLink2.onclick = null;
      }

      popup.classList.add("show");
      popup.setAttribute("aria-hidden", "false");
    }

    function closePopup() {
      popup.classList.remove("show");
      popup.setAttribute("aria-hidden", "true");
    }

    window.addEventListener("load", function() {
      setTimeout(function() {
        const loader = document.getElementById("loader");
        loader.style.opacity = "0";
        setTimeout(function() {
          loader.style.display = "none";
        }, 400);
      }, 1200);
    });

    document.addEventListener("click", function(event) {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        window.location.href = pageButton.dataset.page;
        return;
      }

      const popupButton = event.target.closest("[data-popup]");
      if (popupButton) {
        openPopup(popupButton.dataset.popup);
        return;
      }

      const externalButton = event.target.closest("[data-url]");
      if (externalButton) {
        openExternal(externalButton.dataset.url);
        return;
      }

      if (event.target === popup) {
        closePopup();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closePopup();
      }
    });
  </script>
</body>
</html>
