<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>LOS SICARIOS</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: -5;
      background: url("logosfondo.jpg") center / cover no-repeat;
      transform: scale(1.08);
      filter: contrast(1.08) brightness(.88);
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 6%, rgba(255,255,255,.22), transparent 22%),
        radial-gradient(circle at 14% 80%, rgba(255,255,255,.10), transparent 26%),
        radial-gradient(circle at 88% 52%, rgba(255,255,255,.08), transparent 28%),
        linear-gradient(to bottom, rgba(0,0,0,.34), rgba(0,0,0,.82) 46%, rgba(0,0,0,.98));
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: -4;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 78%);
    }

    .glow {
      position: fixed;
      z-index: -3;
      border-radius: 999px;
      filter: blur(72px);
      pointer-events: none;
      opacity: .34;
      animation: float 9s ease-in-out infinite;
    }

    .glow.one {
      width: 210px;
      height: 210px;
      top: -58px;
      right: -54px;
      background: rgba(255,255,255,.20);
    }

    .glow.two {
      width: 190px;
      height: 190px;
      bottom: 36px;
      left: -66px;
      background: rgba(255,255,255,.13);
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      50% { transform: translate3d(12px,22px,0) scale(1.08); }
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(0,0,0,.22), rgba(0,0,0,.96)),
        url("logosfondo.jpg") center / cover no-repeat;
      transition: opacity .45s ease, visibility .45s ease;
    }

    .loader-orbit {
      position: relative;
      width: 230px;
      height: 230px;
      display: grid;
      place-items: center;
    }

    .loader-orbit::before,
    .loader-orbit::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 0 45px rgba(255,255,255,.06), 0 0 70px rgba(255,255,255,.13);
      animation: spin 5s linear infinite;
    }

    .loader-orbit::after {
      inset: 18px;
      opacity: .55;
      animation-direction: reverse;
      animation-duration: 7s;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .logo {
      width: 134px;
      height: 134px;
      object-fit: cover;
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.06);
      box-shadow: 0 24px 70px rgba(0,0,0,.86), 0 0 42px rgba(255,255,255,.18);
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 11px 8px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.44);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 35px rgba(0,0,0,.45);
    }

    .brand-chip img {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      object-fit: cover;
    }

    .brand-chip span {
      font-size: 10px;
      font-weight: 1000;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      color: rgba(255,255,255,.78);
    }

    .signal-dot {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(16px);
      box-shadow: inset 0 0 20px rgba(255,255,255,.04);
    }

    .signal-dot::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 18px rgba(255,255,255,.95);
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: .45; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .hero {
      text-align: left;
      padding-top: 12px;
    }

    .hero-logo {
      position: relative;
      width: 156px;
      height: 156px;
      margin: 8px 0 22px;
    }

    .hero-logo::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 46px;
      border: 1px solid rgba(255,255,255,.22);
      transform: rotate(-8deg);
    }

    .hero-logo::after {
      content: "";
      position: absolute;
      inset: -30px;
      border-radius: 54px;
      border: 1px solid rgba(255,255,255,.10);
      transform: rotate(10deg);
    }

    .hero-logo .logo {
      width: 156px;
      height: 156px;
      border-radius: 39px;
      position: relative;
      z-index: 1;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.66);
      font-size: 10px;
      font-weight: 1000;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 26px;
      height: 1px;
      background: rgba(255,255,255,.44);
      box-shadow: 0 0 12px rgba(255,255,255,.55);
    }

    h1 {
      margin: 12px 0 0;
      font-size: clamp(45px, 15vw, 76px);
      line-height: .78;
      letter-spacing: -4px;
      font-weight: 1000;
      text-transform: uppercase;
      text-shadow: 0 0 22px rgba(255,255,255,.28), 0 18px 42px rgba(0,0,0,.9);
    }

    .wordmark {
      margin-top: 12px;
      color: rgba(255,255,255,.58);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 850;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      max-width: 310px;
    }

    .vault {
      position: relative;
      padding: 15px;
      border-radius: 38px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.035)),
        rgba(0,0,0,.64);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 90px rgba(0,0,0,.88), inset 0 1px 0 rgba(255,255,255,.20);
      overflow: hidden;
    }

    .vault::before {
      content: "";
      position: absolute;
      inset: -1px;
      background: linear-gradient(115deg, transparent, rgba(255,255,255,.22), transparent 43%);
      animation: shine 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0%, 35% { transform: translateX(-110%); }
      65%, 100% { transform: translateX(110%); }
    }

    .catalog-btn {
      position: relative;
      width: 100%;
      min-height: 235px;
      border: 0;
      border-radius: 32px;
      color: #fff;
      text-align: left;
      overflow: hidden;
      cursor: pointer;
      padding: 22px;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.02), rgba(0,0,0,.78)),
        url("logosfondo.jpg") center / cover no-repeat;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 0 60px rgba(255,255,255,.07), 0 22px 55px rgba(0,0,0,.65);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      isolation: isolate;
    }

    .catalog-btn::before {
      content: "CATALOGO";
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 10px;
      letter-spacing: 2.4px;
      font-weight: 1000;
      color: rgba(255,255,255,.64);
      z-index: 1;
    }

    .catalog-btn::after {
      content: "01";
      position: absolute;
      right: 18px;
      top: 15px;
      font-size: 54px;
      line-height: 1;
      font-weight: 1000;
      color: rgba(255,255,255,.09);
    }

    .catalog-title {
      position: relative;
      z-index: 1;
      display: block;
      font-size: 45px;
      line-height: .88;
      letter-spacing: -2px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .catalog-sub {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 8px;
      color: rgba(255,255,255,.62);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .quick-grid {
      margin-top: 13px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .quick-btn {
      position: relative;
      min-height: 132px;
      border: 0;
      border-radius: 26px;
      padding: 13px;
      color: #fff;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,.21), transparent 34%),
        linear-gradient(155deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: inset 0 0 28px rgba(255,255,255,.035), 0 14px 32px rgba(0,0,0,.48);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .quick-btn::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      right: -30px;
      bottom: -28px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      transform: rotate(18deg);
    }

    .quick-btn:active,
    .catalog-btn:active {
      transform: scale(.975);
    }

    .ico {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
      font-size: 21px;
      box-shadow: inset 0 0 18px rgba(255,255,255,.045);
    }

    .quick-btn small {
      display: block;
      color: rgba(255,255,255,.56);
      font-size: 9px;
      font-weight: 1000;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .quick-btn strong {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: .2px;
      text-transform: uppercase;
    }

    .popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }

    .popup-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-box {
      width: 100%;
      max-width: 480px;
      border-radius: 31px;
      padding: 20px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.04)),
        rgba(5,5,5,.95);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 24px 80px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.18);
      transform: translateY(22px) scale(.98);
      transition: transform .22s ease;
    }

    .popup-overlay.show .popup-box {
      transform: translateY(0) scale(1);
    }

    .handle {
      width: 48px;
      height: 5px;
      border-radius: 999px;
      margin: 0 auto 18px;
      background: rgba(255,255,255,.24);
    }

    .popup-title {
      margin-bottom: 14px;
      text-align: center;
      font-size: 26px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .popup-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: 16px;
      margin-top: 10px;
      color: #fff;
      text-decoration: none;
      border-radius: 21px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.13);
      font-size: 15px;
      font-weight: 950;
    }

    .popup-link::after {
      content: "↗";
      opacity: .72;
      font-size: 18px;
    }

    @media (max-width: 390px) {
      .app { padding-left: 13px; padding-right: 13px; }
      .hero-logo, .hero-logo .logo { width: 134px; height: 134px; }
      h1 { font-size: 46px; }
      .catalog-btn { min-height: 205px; }
      .catalog-title { font-size: 38px; }
      .quick-grid { gap: 8px; }
      .quick-btn { min-height: 118px; padding: 11px; border-radius: 23px; }
      .ico { width: 38px; height: 38px; border-radius: 14px; font-size: 19px; }
      .quick-btn strong { font-size: 11px; }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="loader-orbit">
      <img class="logo" src="logopricipale.jpg" alt="LOS SICARIOS" />
    </div>
  </div>

  <div class="bg"></div>
  <div class="grid-bg"></div>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="app">
    <header class="topbar">
      <div class="brand-chip">
        <img src="logopricipale.jpg" alt="Logo" />
        <span>Private Access</span>
      </div>
      <div class="signal-dot" aria-hidden="true"></div>
    </header>

    <section class="hero">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;">
        <div>
          <div class="kicker">Exclusive Access</div>
          <h1 style="margin-top:10px;">LOS<br>SICARIOS</h1>
         
        </div>

        <div class="hero-logo" style="width:110px;height:110px;margin:0;">
          <img class="logo" src="logopricipale.jpg" alt="LOS SICARIOS" style="width:110px;height:110px;border-radius:28px;" />
        </div>
      </div>
    </section>

    <section class="vault" aria-label="Menu principale">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div>
          <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:900;">Main Access</div>
          <div style="margin-top:5px;font-size:24px;font-weight:1000;letter-spacing:-1px;">Dashboard</div>
        </div>

        <div style="width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.08);display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);font-size:18px;">✦</div>
      </div>

      <button class="catalog-btn" type="button" data-page="catalog.html" style="min-height:180px;border-radius:34px;">
        <span class="catalog-title" style="font-size:42px;">Catalogo</span>
        <span class="catalog-sub">Accesso completo</span>
      </button>

      <div style="margin-top:14px;display:grid;gap:12px;">

        <button class="quick-btn" type="button" data-popup="contacts" style="min-height:88px;border-radius:24px;display:flex;flex-direction:row;align-items:center;gap:14px;">
          <div class="ico">✉️</div>
          <div style="text-align:left;">
            <small>Direct Access</small>
            <strong style="font-size:18px;">Contatti</strong>
          </div>
        </button>

        <button class="quick-btn" type="button" data-popup="channels" style="min-height:88px;border-radius:24px;display:flex;flex-direction:row;align-items:center;gap:14px;">
          <div class="ico">📡</div>
          <div style="text-align:left;">
            <small>Official Group</small>
            <strong style="font-size:18px;">Channel</strong>
          </div>
        </button>

        <button class="quick-btn" type="button" data-page="recensioni.html" style="min-height:88px;border-radius:24px;display:flex;flex-direction:row;align-items:center;gap:14px;">
          <div class="ico">★</div>
          <div style="text-align:left;">
            <small>User Feedback</small>
            <strong style="font-size:18px;">Recensioni</strong>
          </div>
        </button>

      </div>
    </section>
  </main>

  <div id="popup" class="popup-overlay" aria-hidden="true">
    <div class="popup-box" role="dialog" aria-modal="true">
      <div class="handle"></div>
      <div class="popup-title" id="popup-title"></div>
      <a class="popup-link" id="popup-link-1" href="#" target="_blank" rel="noopener"></a>
      <a class="popup-link" id="popup-link-2" href="#" target="_blank" rel="noopener" style="display:none;"></a>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#000000");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#000000");
    }

    const links = {
      contacts: {
        title: "Contatti",
        firstText: "📨 Telegram",
        firstUrl: "https://t.me/JJ_OFFICIAL999",
        secondText: "📞 Signal",
        secondUrl: "https://signal.me/#eu/bpFlSUFSW3Sq1RnylvtoF15ilKbwP9LSU6mwwCgjwrQ-R2RWcSNKWbMcnhvy_2RQ"
      },
      channels: {
        title: "Channel",
        firstText: "📢 Telegram Channel",
        firstUrl: "https://t.me/+398_0ofVUk42N2E0"
      }
    };

    const popup = document.getElementById("popup");
    const popupTitle = document.getElementById("popup-title");
    const popupLink1 = document.getElementById("popup-link-1");
    const popupLink2 = document.getElementById("popup-link-2");

    function haptic(type) {
      if (!tg || !tg.HapticFeedback) return;
      if (type === "impact") tg.HapticFeedback.impactOccurred("medium");
      if (type === "success") tg.HapticFeedback.notificationOccurred("success");
    }

    function openExternal(url) {
      if (!url) return;
      haptic("impact");

      if (tg && typeof tg.openLink === "function") {
        tg.openLink(url);
      } else {
        window.open(url, "_blank", "noopener,noreferrer");
      }
    }

    function openPopup(type) {
      const data = links[type];
      if (!data) return;

      haptic("success");
      popupTitle.textContent = data.title;
      popupLink1.textContent = data.firstText;
      popupLink1.href = data.firstUrl;
      popupLink1.onclick = function(event) {
        event.preventDefault();
        openExternal(data.firstUrl);
      };

      if (data.secondText && data.secondUrl) {
        popupLink2.textContent = data.secondText;
        popupLink2.href = data.secondUrl;
        popupLink2.style.display = "flex";
        popupLink2.onclick = function(event) {
          event.preventDefault();
          openExternal(data.secondUrl);
        };
      } else {
        popupLink2.style.display = "none";
        popupLink2.removeAttribute("href");
        popupLink2.onclick = null;
      }

      popup.classList.add("show");
      popup.setAttribute("aria-hidden", "false");
    }

    function closePopup() {
      popup.classList.remove("show");
      popup.setAttribute("aria-hidden", "true");
    }

    window.addEventListener("load", function() {
      setTimeout(function() {
        const loader = document.getElementById("loader");
        loader.style.opacity = "0";
        loader.style.visibility = "hidden";
      }, 5000);
    });

    document.addEventListener("click", function(event) {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        haptic("impact");
        window.location.href = pageButton.dataset.page;
        return;
      }

      const popupButton = event.target.closest("[data-popup]");
      if (popupButton) {
        openPopup(popupButton.dataset.popup);
        return;
      }

      if (event.target === popup) closePopup();
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closePopup();
    });
  </script>
</body>
</html>
